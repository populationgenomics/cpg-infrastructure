[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpg-infra"
version = "0.1.0"
description = "CPG Infrastructure"
readme = "README.md"
requires-python = "==3.11.*"
# the TOML-table form is deprecated by setuptools, but cyclonedx-py --pyproject
# (sbom.yaml) cannot parse a PEP 639 license expression
license = { text = "MIT" }
keywords = ["cpg", "infrastructure"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # fix boto3/core version to prevent pip downloading all the versions caused by cloudpathlib
    "boto3>=1.28.56",
    "botocore>=1.31.56",
    "cpg-utils>=4.15.1",
    "google-api-python-client==2.*",
    "google-auth==2.*",
    "pydantic>=2",
    "pulumi-gcp~=7.6",
    "pulumi-github>=6.0.0",
    "pulumi==3.260.0",
    "pytest==9.1.0",
    "toml-sort",
    "toml==0.10.2",
    "xxhash==3.2.0",
    "metamist",
    "metamist-infrastructure @ git+https://github.com/populationgenomics/metamist.git@main#subdirectory=metamist_infrastructure",
    # not directly required, pinned by pip-audit to avoid a vulnerability
    "setuptools>=65.5.1",
]

[project.urls]
Homepage = "https://github.com/populationgenomics/cpg-infrastructure"

[project.entry-points."cpginfra.plugins"]
billing_aggregator = "cpg_infra.billing_aggregator.driver:BillingAggregator"

[dependency-groups]
dev = [
    "pre-commit",
    "coverage",
    "pip-audit",
    "google-api-python-client-stubs==1.15.0",
    "google-cloud-storage==2.14.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cpg_infra*"]

[tool.setuptools.package-data]
# read off disk by utils.archive_folder() to build the Cloud Function AssetArchives
"cpg_infra" = ["**/*.txt", "**/*.json"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# ignore pydocstyle, flake8-boolean-trap (FBT)
select = ["A", "B", "C",  "E", "F", "G", "I", "N", "Q", "S", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "ERA", "EXE", "FBT", "ICN", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "UP", "YTT"]

ignore = [
    "ANN101",  # Missing type annotation for self in method
    "ANN201",  # Missing return type annotation for public function
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
    "E501",    # Line length too long
    "E731",    # Do not assign a lambda expression, use a def
    "E741",    # Ambiguous variable name
    "G004",    # Logging statement uses f-string
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLW0603", # Using the global statement to update `<VAR>` is discouraged
    "PT018",   # Assertion should be broken down into multiple parts
    "Q000",    # Single quotes found but double quotes preferred
    "Q003",    #
    "S101",    # Use of assert detected
    # ruff asked these to be disabled to use the formatter, as it cause some instability
    #   https://github.com/astral-sh/ruff/issues/8272
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation

]


[tool.ruff.lint.isort]

section-order = ["future", "standard-library", "third-party", "hail", "cpg", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
hail = [
    "hail",
    "hailtop",
]
# Adjust these for each repository, e.g., removing those that should be
# local rather than CPG. Also fill in extend_skip below if there are any
# subdirectories that should be ignored.
cpg = [
    "analysis_runner",
    "cpg_infra",
    "cpg_utils",
    "cpg_workflows",
    "gnomad",
    "hail_scripts",
    "metamist",
]
