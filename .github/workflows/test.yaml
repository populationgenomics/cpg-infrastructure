name: Test
on:
  pull_request:
    types: ["opened", "synchronize"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 #v10.3.0
        with:
          activate-environment: true
          enable-cache: false
          version: 0.12.9 #uv version

      - name: Install packages
        run: uv sync --upgrade-package metamist-infrastructure

      - name: pre-commit
        run: pre-commit run --all-files

      - name: Run tests using coverage
        id: runtests
        run: |
          coverage run -m pytest test --junitxml=test-execution.xml
          rc=$?
          coverage xml

          echo "rc=$rc" >> $GITHUB_OUTPUT

      - name: 'Save coverage report as an Artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: coverage-report
          path: ./coverage.xml

      - name: 'Save execution report as an Artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: execution-report
          path: ./test-execution.xml

      - name: "Upload coverage report"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }} # required

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d #v2.25.0
        if: always()
        with:
          files: test-execution.xml

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 #v3.0.0
        if: always()
        with:
          name: Test Results
          path: test-execution.xml
          reporter: java-junit

      - name: Fail if tests are not passing
        if: ${{ steps.runtests.outputs.rc != 0 }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            core.setFailed('Unit tests failed with rc = ${{ steps.runtests.outputs.rc }}')
